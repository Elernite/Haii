<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Pixel Love</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Lapisan konten teks utama di tengah layar */
        #content-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        /* Gaya teks utama: Font piksel monospace tebal dengan efek pendaran LED video */
        .matrix-glow-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 6.5rem;
            font-weight: 900;
            color: #ffffff;
            display: none;
            letter-spacing: -2px;
            /* Efek pendaran warna pink neon tebal seperti di video */
            text-shadow: 
                0 0 10px #ffffff, 
                0 0 20px #ff007f, 
                0 0 40px #ff007f, 
                0 0 60px #ff007f;
            animation: monitorBlink 0.8s infinite alternate;
        }

        @keyframes monitorBlink {
            0% { transform: scale(0.97); opacity: 0.9; }
            100% { transform: scale(1.03); opacity: 1; }
        }

        /* Gaya khusus adegan akhir: Hati piksel digital & teks sayang */
        #final-love-scene {
            display: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ff3399;
            line-height: 1.2;
            /* Warna pendaran pink pekat untuk struktur hati */
            text-shadow: 
                0 0 5px #ff3399, 
                0 0 15px #ff007f, 
                0 0 30px #ff007f;
            animation: pulseHeart 0.8s infinite alternate;
        }

        @keyframes pulseHeart {
            0% { transform: scale(0.95); filter: brightness(0.9); }
            100% { transform: scale(1.05); filter: brightness(1.2); }
        }
    </style>
</head>
<body>

    <!-- Canvas Efek Hujan Teks "I LOVE YOU ❤️" -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Kontainer Teks Tengah yang Sama Persis -->
    <div id="content-layer">
        <!-- Urutan Hitung Mundur -->
        <div id="num3" class="matrix-glow-text">3</div>
        <div id="num2" class="matrix-glow-text">2</div>
        <div id="num1" class="matrix-glow-text">1</div>
        
        <!-- Urutan Kalimat -->
        <div id="txtYou" class="matrix-glow-text">You</div>
        <div id="txtAre" class="matrix-glow-text">Are</div>
        <div id="txtMy" class="matrix-glow-text">My</div>
        <div id="txtLove" class="matrix-glow-text">Love</div>

        <!-- Bentuk Hati Piksel Digital Tengah Akhir (Persis seperti Video) -->
        <pre id="final-love-scene">
    00000       00000    
  000000000   000000000  
 00000000000 00000000000 
0000000000000000000000000
0000                  000
000  I LOVE ❤ SAYANG  000
 000                000  
  00000          00000   
    000000    000000     
       0000000000        
          0000           
        </pre>
    </div>

    <script>
        // --- 1. CODE LOGIKA HUJAN MATRIX "I LOVE YOU ❤️" ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixString = "I LOVE YOU ❤️ ";
        const matrixChars = matrixString.split("");

        const fontSize = 18;
        const columns = canvas.width / fontSize;

        const drops = [];
        const charIndices = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * -100;
            charIndices[x] = Math.floor(Math.random() * matrixChars.length);
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Warna hujan pink redup agar tidak menabrak teks putih di tengah
            ctx.fillStyle = '#660033'; 
            ctx.font = 'bold ' + fontSize + 'px monospace';

            for (let i = 0; i < columns; i++) {
                const charIndex = charIndices[i];
                const text = matrixChars[charIndex];

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                charIndices[i] = (charIndices[i] + 1) % matrixChars.length;

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 40);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });


        // --- 2. CODE URUTAN TIMELINE KATA (PERSIS VIDEO) ---
        const delayTime = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startLoveSequence() {
            const step = 950; // Durasi ketukan perpindahan per kata

            // Fase 1: 3, 2, 1
            await delayTime(500);
            document.getElementById('num3').style.display = 'block';
            await delayTime(step);
            document.getElementById('num3').style.display = 'none';

            document.getElementById('num2').style.display = 'block';
            await delayTime(step);
            document.getElementById('num2').style.display = 'none';

            document.getElementById('num1').style.display = 'block';
            await delayTime(step);
            document.getElementById('num1').style.display = 'none';

            // Fase 2: You Are My Love
            document.getElementById('txtYou').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtYou').style.display = 'none';

            document.getElementById('txtAre').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtAre').style.display = 'none';

            document.getElementById('txtMy').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtMy').style.display = 'none';

            document.getElementById('txtLove').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtLove').style.display = 'none';

            // Fase 3: Hati Piksel "I LOVE ❤ SAYANG"
            await delayTime(300);
            document.getElementById('final-love-scene').style.display = 'block';
        }

        window.onload = startLoveSequence;
    </script>
</body>
</html>
