<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Particle Dot LED Matrix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* Seluruh elemen visual disatukan dalam satu kanvas grafis interaktif */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="loveCanvas"></canvas>

    <script>
        const canvas = document.getElementById('loveCanvas');
        const ctx = canvas.getContext('2d');

        // Menyesuaikan resolusi layar internal canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        // --- 1. SETTING HUJAN MATRIX BACKGROUND ---
        const matrixString = "I LOVE YOU ❤️ ";
        const matrixChars = matrixString.split("");
        const matrixFontSize = 16;
        const matrixColumns = Math.ceil(canvas.width / matrixFontSize);
        const matrixDrops = Array(matrixColumns).fill(-50);
        const matrixCharIndices = Array(matrixColumns).fill(0).map(() => Math.floor(Math.random() * matrixChars.length));

        function drawMatrixBackground() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4d0026'; // Warna pink gelap redup di latar belakang
            ctx.font = 'bold ' + matrixFontSize + 'px monospace';

            for (let i = 0; i < matrixColumns; i++) {
                const text = matrixChars[matrixCharIndices[i]];
                const x = i * matrixFontSize;
                const y = matrixDrops[i] * matrixFontSize;

                ctx.fillText(text, x, y);

                matrixCharIndices[i] = (matrixCharIndices[i] + 1) % matrixChars.length;
                if (y > canvas.height && Math.random() > 0.975) {
                    matrixDrops[i] = 0;
                }
                matrixDrops[i]++;
            }
        }

        // --- 2. STRUKTUR TEKS DOT LED & MAP KOORDINAT PARTIKEL ---
        // Kumpulan cetakan bentuk piksel manual untuk animasi berpindah tempat
        const scenes = {
            "3": ["  ●●●●  ", " ●    ● ", "      ● ", "   ●●●  ", "      ● ", " ●    ● ", "  ●●●●  "],
            "2": ["  ●●●●  ", " ●    ● ", "     ●  ", "   ●    ", "  ●     ", " ●      ", " ●●●●●● "],
            "1": ["   ●●   ", "  ●●●   ", "   ●●   ", "   ●●   ", "   ●●   ", "   ●●   ", "  ●●●●  "],
            "You": ["●  ●  ●●●  ●  ●", "●  ● ●   ● ●  ●", " ●●  ●   ● ●  ●", "  ●  ●   ● ●  ●", "  ●  ●   ● ●  ●", "  ●   ●●●   ●●  "],
            "Are": ["  ●●   ●●●  ●●●●", " ●  ●  ●  ● ●   ", "●    ● ●●●  ●●● ", "●●●●●● ●  ● ●   ", "●    ● ●  ● ●   ", "●    ● ●  ● ●●●●"],
            "My":  ["●   ● ●  ●", "●● ●● ●  ●", "● ● ●  ●● ", "●   ●  ●  ", "●   ●  ●  ", "●   ●  ●  "],
            "Love": ["●     ●●●  ●  ● ●●●●", "●    ●   ● ●  ● ●   ", "●    ●   ●  ●●  ●●● ", "●    ●   ●  ●●  ●   ", "●●●●  ●●●    ●  ●●●●"],
            "Heart": [
                "  ●●●●   ●●●●  ",
                " ●●●●●● ●●●●●● ",
                "●●●●●●●●●●●●●●●",
                "●●●●●●●●●●●●●●●",
                " ●●●●●●●●●●●●● ",
                "  ●●●●●●●●●●●  ",
                "    ●●●●●●●    ",
                "      ●●●      ",
                "       ●       "
            ]
        };

        // Fungsi untuk mengekstrak matriks cetakan di atas menjadi titik koordinat X dan Y nyata di tengah layar
        function getSceneCoordinates(matrix, scale = 14) {
            const coords = [];
            const rows = matrix.length;
            const cols = matrix[0].length;
            
            const startX = (canvas.width - cols * scale) / 2;
            const startY = (canvas.height - rows * scale) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (matrix[r][c] === '●') {
                        coords.push({
                            x: startX + c * scale,
                            y: startY + r * scale
                        });
                    }
                }
            }
            return coords;
        }

        // --- 3. CLASS ENGINE PARTIKEL INDIVIDUAL ---
        class LedParticle {
            constructor(x, y) {
                this.x = Math.random() * canvas.width;  // Lahir di posisi acak sembarang tempat
                this.y = Math.random() * canvas.height;
                this.targetX = x;
                this.targetY = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 4.5; // Ukuran bulatan dot lampu besar LED
                this.speedMultiplier = 0.08; // Kecepatan perpindahan meluncur
                this.friction = 0.85;
                this.isFinalScene = false;
            }

            updateTarget(newX, newY, isFinal = false) {
                this.targetX = newX;
                this.targetY = newY;
                this.isFinalScene = isFinal;
            }

            update() {
                if (this.isFinalScene) {
                    // EFEK AKHIR: Dot menyebar random tipis dan bergetar (jiggle) aktif di tempatnya
                    const jiggleX = (Math.random() - 0.5) * 3.5;
                    const jiggleY = (Math.random() - 0.5) * 3.5;
                    
                    // Tarikan menuju target dibuat sangat lentur + getaran konstan
                    this.vx += (this.targetX - this.x) * 0.02;
                    this.vy += (this.targetY - this.y) * 0.02;
                    this.x += this.vx + jiggleX;
                    this.y += this.vy + jiggleY;
                } else {
                    // EFEK TRANSISI: Fisika gerak meluncur perpindahan tempat dari angka 3, ke 2, ke 1
                    this.vx += (this.targetX - this.x) * this.speedMultiplier;
                    this.vy += (this.targetY - this.y) * this.speedMultiplier;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.x += this.vx;
                    this.y += this.vy;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // Efek pancaran pendaran cahaya neon pink menyala pekat pada setiap partikel dot
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff007f';
                ctx.fill();
                
                // Reset efek shadow agar tidak merusak grafis lain
                ctx.shadowBlur = 0; 
            }
        }

        // Pembuatan pool partikel awal (menggunakan kuota maksimal agar bentuk objek padat)
        const particles = [];
        const initialCoords = getSceneCoordinates(scenes["3"], 15);
        for (let i = 0; i < 400; i++) {
            const coord = initialCoords[i % initialCoords.length];
            particles.push(new LedParticle(coord.x, coord.y));
        }

        // Fungsi mencocokkan partikel aktif dengan bentuk scene baru
        function transitionToScene(sceneName, isFinal = false, scaleSize = 15) {
            const targetCoords = getSceneCoordinates(scenes[sceneName], scaleSize);
            const totalTargets = targetCoords.length;

            particles.forEach((p, idx) => {
                const target = targetCoords[idx % totalTargets];
                // Suntikkan koordinat baru, partikel otomatis meluncur berpindah arah
                p.updateTarget(target.x, target.y, isFinal);
            });
        }

        // --- 4. CORE ENGINE LOOP ANIMASI ---
        function mainLoop() {
            // Draw background matrix rain biner dahulu
            drawMatrixBackground();

            // Render dan update semua partikel lampu LED besar
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Jika di adegan akhir, gambar teks tambahan "I LOVE YOU SAYANG" di bawah hati yang bergetar
            if (currentTimelineIndex === 7) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Courier New';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff3399';
                ctx.fillText("I LOVE ❤ SAYANG", canvas.width / 2, (canvas.height / 2) + 110);
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(mainLoop);
        }

        // --- 5. MANAGEMENT TIMELINE SEKUENS WAKTU (Otomatis Jalur Alir) ---
        let currentTimelineIndex = 0;
        const timeline = ["3", "2", "1", "You", "Are", "My", "Love", "Heart"];
        const stepDuration = 1000; // Tempo perpindahan adegan (1 detik)

        async function startTimelineFlow() {
            // Tampilkan adegan awal (Angka 3)
            transitionToScene("3", false, 18);
            
            while (currentTimelineIndex < timeline.length - 1) {
                await new Promise(res => setTimeout(res, stepDuration));
                currentTimelineIndex++;
                
                const nextScene = timeline[currentTimelineIndex];
                
                if (nextScene === "Heart") {
                    // Pindah ke adegan hati akhir: aktifkan parameter gerak acak menyebar & getar di tempat (isFinal = true)
                    transitionToScene("Heart", true, 16);
