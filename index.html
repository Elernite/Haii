<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix I Love You Rain</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Lapisan konten teks di tengah */
        #content-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            pointer-events: none;
        }

        /* Gaya font teks utama dengan pendaran neon pink */
        .matrix-glow-text {
            font-size: 6rem;
            font-weight: 900;
            color: #ffffff;
            display: none;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px #fff, 
                0 0 20px #ff007f, 
                0 0 40px #ff007f, 
                0 0 60px #ff007f;
            animation: pulseEffect 0.8s infinite alternate;
        }

        @keyframes pulseEffect {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Gaya khusus untuk adegan hati digital terakhir */
        #final-love-scene {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: pulseEffect 0.6s infinite alternate;
        }

        .digital-heart {
            font-size: 9rem;
            color: #ff007f;
            filter: drop-shadow(0 0 20px #ff007f);
            line-height: 1;
            margin-bottom: 15px;
        }

        .sub-message {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Canvas Efek Hujan Teks "I LOVE YOU ❤️" -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Kontainer Teks Utama -->
    <div id="content-layer">
        <!-- Hitung Mundur -->
        <div id="num3" class="matrix-glow-text">3</div>
        <div id="num2" class="matrix-glow-text">2</div>
        <div id="num1" class="matrix-glow-text">1</div>
        
        <!-- Kalimat Pembuka -->
        <div id="txtYou" class="matrix-glow-text">You</div>
        <div id="txtAre" class="matrix-glow-text">Are</div>
        <div id="txtMy" class="matrix-glow-text">My</div>
        <div id="txtLove" class="matrix-glow-text">Love</div>

        <!-- Adegan Akhir: Emot Love Besar & Tulisan Sayang -->
        <div id="final-love-scene">
            <div class="digital-heart">❤️</div>
            <div class="sub-message">I Love You Sayang</div>
        </div>
    </div>

    <script>
        // --- 1. LOGIKA HUJAN MATRIX "I LOVE YOU ❤️" ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Kalimat yang akan mengalir ke bawah
        const matrixString = "I LOVE YOU ❤️ ";
        const matrixChars = matrixString.split("");

        const fontSize = 18;
        const columns = canvas.width / fontSize;

        // Menyimpan posisi vertikal (Y) dan indeks karakter saat ini untuk setiap kolom
        const drops = [];
        const charIndices = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = Math.random() * -100; // Mulai dari atas layar secara acak
            charIndices[x] = Math.floor(Math.random() * matrixChars.length); // Indek awal kalimat acak
        }

        function drawMatrix() {
            // Efek jejak memudar hitam
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Warna hujan teks (Pink neon redup agar teks tengah menonjol)
            ctx.fillStyle = '#99004c'; 
            ctx.font = 'bold ' + fontSize + 'px monospace';

            for (let i = 0; i < columns; i++) {
                // Ambil karakter berurutan berdasarkan indeks kolom masing-masing
                const charIndex = charIndices[i];
                const text = matrixChars[charIndex];

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                // Jalankan urutan kalimatnya ke karakter berikutnya
                charIndices[i] = (charIndices[i] + 1) % matrixChars.length;

                // Jika hujan sudah melewati bawah layar, reset ke atas secara acak
                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 40);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });


        // --- 2. LOGIKA URUTAN WAKTU TIMELINE ---
        const delayTime = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function startLoveSequence() {
            const step = 950; // Kecepatan transisi teks

            // Sesi Hitung Mundur
            await delayTime(500);
            document.getElementById('num3').style.display = 'block';
            await delayTime(step);
            document.getElementById('num3').style.display = 'none';

            document.getElementById('num2').style.display = 'block';
            await delayTime(step);
            document.getElementById('num2').style.display = 'none';

            document.getElementById('num1').style.display = 'block';
            await delayTime(step);
            document.getElementById('num1').style.display = 'none';

            // Sesi Teks Kata demi Kata
            document.getElementById('txtYou').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtYou').style.display = 'none';

            document.getElementById('txtAre').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtAre').style.display = 'none';

            document.getElementById('txtMy').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtMy').style.display = 'none';

            document.getElementById('txtLove').style.display = 'block';
            await delayTime(step);
            document.getElementById('txtLove').style.display = 'none';

            // Sesi Akhir: Emot Love Berkedip & Pesan
            await delayTime(300);
            document.getElementById('final-love-scene').style.display = 'flex';
        }

        window.onload = startLoveSequence;
    </script>
</body>
</html>
